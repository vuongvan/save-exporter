plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.saveexporter'
    compileSdk 34

    defaultConfig {
        // ============================================================
        // QUAN TRỌNG: Đổi dòng dưới thành ĐÚNG package name của app mod
        // Lấy bằng lệnh: aapt dump badging mod.apk | grep package
        // ============================================================
        applicationId "it.paranoidsquirrels.idleguildmastes"

        minSdk 21
        targetSdk 33
        versionCode 158
        versionName "2.147"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
